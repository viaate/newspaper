<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe9de">
<title>The Olivia Times Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* The archive wears the paper's own type: UnifrakturMaguntia nameplate, Playfair headlines,
   Source Serif text, Libre Franklin for the small working labels. */
:root, [data-theme="night"] {
  --bg: #100f0d; --raise: #191714; --raise2: #221f1b; --rule: #34302a; --rule2: #4a453d;
  --ink: #eee8dc; --soft: #b3ab9b; --dim: #8a8273; --red: #e8503f; --on-red: #fff8f3; --page: #f4efe5;
  --shadow: 0 18px 40px -12px rgba(0, 0, 0, .7), 0 4px 10px rgba(0, 0, 0, .35);
}
[data-theme="day"] {
  --bg: #efe9de; --raise: #f7f3eb; --raise2: #e6dfd2; --rule: #d3cabb; --rule2: #b9ae9c;
  --ink: #17140f; --soft: #5a5246; --dim: #786f60; --red: #c0392b; --on-red: #fff8f3; --page: #fffdf8;
  --shadow: 0 18px 36px -14px rgba(70, 50, 25, .38), 0 3px 8px rgba(70, 50, 25, .16);
}
:root { --sans: "Libre Franklin", system-ui, sans-serif; --serif: "Source Serif 4", Georgia, serif;
        --display: "Playfair Display", Georgia, serif; --black: "UnifrakturMaguntia", serif; --out: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.5;
       -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; scrollbar-color: var(--rule2) var(--bg); caret-color: var(--red); }
body { margin: 0; min-height: 100vh; overflow-x: hidden; transition: background-color .3s, color .3s; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }
[hidden] { display: none !important; }
::selection { background: var(--red); color: var(--on-red); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 2px; }
.nameplate { font-family: var(--black); font-weight: 400; line-height: .95; margin: 0; }
.wrap { width: min(1180px, 100%); margin: 0 auto; padding: 0 clamp(16px, 4vw, 44px); }
.num { font-variant-numeric: lining-nums tabular-nums; }
.square { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--rule); border-radius: 8px; background: none; transition: border-color .2s, background-color .2s; }
.square:hover { border-color: var(--rule2); background: var(--raise); }
.square svg { width: 18px; height: 18px; }

/* ============ lock: a passcode form, set like a page ============ */
#lock { position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: var(--bg); color: var(--ink); display: grid; place-items: center; padding: 32px 16px; }
.form { width: min(660px, 100%); text-align: center; }
.form .nameplate { font-size: clamp(50px, 12vw, 92px); }
.dateline { margin: 22px auto 30px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 7px 2px 6px; display: flex; justify-content: space-between;
            font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
.ask { font-size: 19px; color: var(--soft); margin: 0 0 26px; }
.blanks { display: flex; justify-content: center; gap: 18px; height: 34px; align-items: end; margin-bottom: 30px; }
.blank { width: 44px; height: 2px; background: var(--rule2); position: relative; transition: background-color .15s, height .15s; }
.blank.on { background: var(--ink); height: 4px; }
.blank.on::before { content: ""; position: absolute; left: 50%; bottom: 12px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: var(--ink); }
.blanks.wrong .blank, .blanks.right .blank { background: var(--red); }
.blanks.wrong .blank.on::before { background: var(--red); }
.blanks.wrong { animation: shake .4s var(--out); }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
.keys { display: grid; grid-template-columns: repeat(3, 92px); justify-content: center; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); width: max-content; margin: 0 auto 26px; }
.key { height: 72px; border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: none; color: var(--ink);
       font-family: var(--display); font-weight: 700; font-size: 30px; transition: background-color .12s, color .12s; -webkit-tap-highlight-color: transparent; }
.key:hover { background: var(--raise); }
.key:active, .key.hit { background: var(--ink); color: var(--bg); }
.key.word { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--soft); }
.key.word:active { background: var(--raise); color: var(--ink); }
.keys .gap { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
#code { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
#code.shown { position: static; opacity: 1; pointer-events: auto; width: min(340px, 100%); height: auto; margin: 0 auto 22px; display: block; padding: 12px 14px;
              background: var(--raise); border: 1px solid var(--rule2); border-radius: 6px; font-size: 20px; text-align: center; letter-spacing: .2em; }
.check { display: inline-flex; align-items: center; gap: 10px; color: var(--soft); font-size: 15px; cursor: pointer; user-select: none; }
.check input { appearance: none; width: 18px; height: 18px; margin: 0; border: 1.5px solid var(--dim); border-radius: 3px; display: grid; place-items: center; cursor: pointer; }
.check input:checked { background: var(--ink); border-color: var(--ink); }
.check input:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: translateY(-1px) rotate(-45deg); }
.status { min-height: 24px; margin: 14px 0 0; color: var(--soft); font-family: var(--sans); font-size: 14px; }
#lock.leaving { animation: leave .7s var(--out) forwards; }
@keyframes leave { to { opacity: 0; transform: translateY(-24px); } }

/* ============ top bar ============ */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 22px; height: 62px; }
.bar .nameplate { font-size: 27px; text-decoration: none; white-space: nowrap; }
.bar nav { display: flex; gap: 22px; margin-left: auto; font-family: var(--sans); font-size: 14px; font-weight: 500; }
.bar nav a { text-decoration: none; color: var(--soft); padding: 6px 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.bar nav a:hover { color: var(--ink); border-color: var(--ink); }
.bar .tools { display: flex; gap: 8px; }

/* ============ the latest issue ============ */
.latest { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(28px, 6vw, 84px); align-items: center;
          min-height: min(820px, calc(100vh - 62px)); padding: clamp(36px, 6vw, 72px) 0 clamp(40px, 6vw, 80px); }
.when { font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--soft); margin: 0 0 18px; }
.when b { color: var(--ink); font-weight: 700; }
.latest h1 { font-family: var(--display); font-weight: 900; font-size: clamp(42px, 6.2vw, 92px); line-height: .98; letter-spacing: -.025em; margin: 0 0 24px; text-wrap: balance; }
.latest .deck { font-size: clamp(19px, 1.6vw, 22px); line-height: 1.45; color: var(--soft); max-width: 38ch; margin: 0 0 26px; }
/* a box score: equal columns, each a small label over a centered value */
.folio { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); max-width: 500px; margin: 0 0 30px;
         border-top: 1px solid var(--rule2); border-bottom: 1px solid var(--rule2); }
.folio div { text-align: center; padding: 10px 6px 11px; }
.folio div + div { border-left: 1px solid var(--rule); }
.folio span { display: block; font-family: var(--sans); font-size: 12px; color: var(--soft); white-space: nowrap; }
.folio b { display: block; font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1.15; margin-top: 3px; color: var(--ink); font-variant-numeric: lining-nums; }
.folio b { color: var(--ink); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; }
.read { display: inline-flex; align-items: center; height: 50px; padding: 0 24px; border-radius: 6px; background: var(--ink); color: var(--bg); text-decoration: none;
        font-family: var(--sans); font-weight: 700; font-size: 15px; transition: background-color .2s, color .2s; }
.read:hover { background: var(--red); color: var(--on-red); }
.textlink { background: none; border: 0; padding: 0; font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--soft); text-decoration: underline; text-decoration-color: var(--rule2); }
.textlink:hover { color: var(--ink); text-decoration-color: var(--ink); }
.stack { position: relative; aspect-ratio: 8.5 / 11; width: min(100%, 500px); justify-self: center; perspective: 1600px; --rx: 0deg; --ry: 0deg; cursor: pointer; }
.sheet { position: absolute; inset: 0; border-radius: 3px; background: var(--page); box-shadow: var(--shadow); overflow: hidden; transition: transform .7s var(--out); }
.sheet img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; opacity: 0; transition: opacity .5s; }
.sheet img.ready { opacity: 1; }
.sheet.s3 { transform: rotateX(var(--rx)) rotateY(var(--ry)) translate3d(30px, -22px, -90px) rotate(5deg); filter: brightness(.72); }
.sheet.s2 { transform: rotateX(var(--rx)) rotateY(var(--ry)) translate3d(14px, -10px, -45px) rotate(2.5deg); filter: brightness(.86); }
.sheet.s1 { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotate(-1.5deg); }
.stack:hover .sheet.s2 { transform: rotateX(var(--rx)) rotateY(var(--ry)) translate3d(34px, -16px, -45px) rotate(4.5deg); }
.stack:hover .sheet.s3 { transform: rotateX(var(--rx)) rotateY(var(--ry)) translate3d(64px, -32px, -90px) rotate(8deg); }
.arrive .sheet { animation: arrive 1.1s var(--out) both; }
.arrive .s2 { animation-delay: .1s; } .arrive .s3 { animation-delay: .2s; }
@keyframes arrive { from { opacity: 0; translate: 0 48px; } }

/* ============ editor's note ============ */
.note { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 26px 0 28px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; }
.note h2 { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.1; margin: 0; }
.note p { font-size: clamp(19px, 1.7vw, 23px); line-height: 1.5; margin: 0; max-width: 62ch; }
.note p b { font-weight: 700; }

/* ============ sections ============ */
section.part { padding-top: clamp(56px, 8vw, 104px); }
.part > header { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
.part h2 { font-family: var(--display); font-weight: 900; font-size: clamp(34px, 4.4vw, 54px); line-height: 1; letter-spacing: -.02em; margin: 0; }
.part > header p { margin: 0; color: var(--soft); font-size: 16px; }

/* calendar: one square per day of the year */
.years { display: flex; gap: 18px; font-family: var(--sans); font-size: 15px; font-weight: 700; }
.years button { background: none; border: 0; padding: 4px 0; color: var(--dim); border-bottom: 2px solid transparent; }
.years button.on { color: var(--ink); border-color: var(--red); }
.year { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 22px 0 18px; }
.grid-scroll { overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
.heat { display: grid; grid-template-rows: 18px repeat(7, var(--cell)); grid-auto-flow: column; grid-auto-columns: var(--cell); gap: 4px; width: max-content;
        --cell: clamp(12px, calc((min(1180px, 100vw) - 88px - 52 * 4px) / 53), 17px); }
.heat .m { font-family: var(--sans); font-size: 11.5px; font-weight: 500; color: var(--soft); white-space: nowrap; }
.heat .d { border-radius: 3px; background: var(--raise2); }
.heat .d.out { visibility: hidden; }
.heat .d.has { background: var(--red); cursor: pointer; transition: transform .15s var(--out); }
.heat .d.has:hover, .heat .d.has:focus-visible { transform: scale(1.35); }
.heat .d.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.key-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 14px; font-family: var(--sans); font-size: 13px; color: var(--soft); }
.key-line i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin: 0 6px 0 14px; }
.key-line i:first-child { margin-left: 0; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 11px; border-radius: 6px; font-size: 14px; line-height: 1.35;
       max-width: 280px; transform: translate(-50%, calc(-100% - 10px)); }
.tip b { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; margin-bottom: 2px; }

/* index of issues */
.find { position: relative; display: block; margin-bottom: 8px; }
.find svg { position: absolute; left: 0; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--dim); }
.find input { width: 100%; border: 0; border-bottom: 1px solid var(--rule2); background: none; padding: 14px 40px 14px 30px; font-size: 19px; outline: none; }
.find input::placeholder { color: var(--dim); }
.find input:focus { border-color: var(--ink); }
.find kbd { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-family: var(--sans); font-size: 12px; color: var(--dim); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 7px; }
.month { margin-top: 40px; }
.month > h3 { font-family: var(--display); font-weight: 900; font-size: 28px; margin: 0; padding-bottom: 10px; border-bottom: 3px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
.month > h3 span { font-family: var(--sans); font-weight: 500; font-size: 14px; color: var(--dim); }
.entry { display: grid; grid-template-columns: 76px minmax(0, 1fr) 118px; gap: 24px; align-items: start; padding: 22px 0; border-bottom: 1px solid var(--rule);
         text-decoration: none; transition: background-color .2s; }
.entry:hover { background: var(--raise); }
.entry .d { padding-left: 4px; }
.entry .d b { display: block; font-family: var(--display); font-weight: 900; font-size: 38px; line-height: 1; font-variant-numeric: lining-nums; }
.entry .d span { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--soft); }
.entry h4 { font-family: var(--display); font-weight: 700; font-size: clamp(21px, 2vw, 26px); line-height: 1.15; margin: 2px 0 8px; text-wrap: balance; transition: color .2s; }
.entry:hover h4 { color: var(--red); }
.entry p { margin: 0 0 10px; color: var(--soft); font-size: 16px; line-height: 1.45; max-width: 64ch; }
.entry .facts { font-family: var(--sans); font-size: 13px; color: var(--dim); }
.entry .thumb { position: relative; aspect-ratio: 8.5 / 11; background: var(--page); border-radius: 2px; overflow: hidden; box-shadow: var(--shadow); transition: transform .5s var(--out); }
.entry:hover .thumb { transform: translateY(-4px) rotate(-1deg); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0; transition: opacity .4s; }
.thumb img.ready { opacity: 1; }
.loading { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(0, 0, 0, .06) 50%, transparent 70%) var(--page); background-size: 200% 100%; animation: load 1.2s linear infinite; }
@keyframes load { to { background-position: -200% 0; } }
.none { color: var(--soft); font-style: italic; padding: 30px 0; }
footer { margin-top: 90px; border-top: 3px solid var(--ink); padding: 26px 0 70px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
footer .nameplate { font-size: 32px; }
footer p { margin: 0; color: var(--soft); font-family: var(--sans); font-size: 14px; }

/* ============ reader: the pages in a column, like turning through the paper ============ */
#reader { position: fixed; inset: 0; z-index: 30; overflow-y: auto; overscroll-behavior: contain; background: var(--raise2); scroll-padding-top: 120px; }
[data-theme="night"] #reader { background: #0a0908; }
.r-top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--rule); }
.r-top .wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.r-top .square:disabled { opacity: .3; cursor: default; }
.r-title { flex: 1; min-width: 0; }
.r-title span { display: block; font-family: var(--sans); font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-title b { display: block; font-family: var(--display); font-weight: 700; font-size: clamp(16px, 2vw, 20px); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-jump { display: flex; gap: 4px; }
.r-jump a { font-family: var(--sans); font-size: 13px; font-weight: 700; text-decoration: none; color: var(--soft); padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; }
.r-jump a:hover { border-color: var(--rule); color: var(--ink); }
.r-jump a.on { background: var(--ink); color: var(--bg); }
.r-pages { width: min(980px, 100%); margin: 0 auto; padding: 22px clamp(0px, 3vw, 24px) 40px; display: grid; gap: 34px; }
.r-page { scroll-margin-top: 120px; }
.r-page .label { display: flex; justify-content: space-between; align-items: baseline; padding: 0 12px 8px; font-family: var(--sans); font-size: 13px; color: var(--soft); }
.r-page .label b { color: var(--ink); font-weight: 700; }
.r-page .label a { color: var(--soft); }
.r-page .sheet-big { position: relative; aspect-ratio: 8.5 / 11; background: #fffdf8; box-shadow: var(--shadow); }
.r-page .sheet-big img { width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .35s; }
.r-page .sheet-big img.ready { opacity: 1; }
.r-end { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 12px 0; }
.r-end a { font-family: var(--sans); font-size: 15px; font-weight: 700; text-decoration: none; padding: 12px 18px; border: 1px solid var(--rule2); border-radius: 6px; }
.r-end a:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

@media (max-width: 980px) {
  .latest { grid-template-columns: 1fr; min-height: 0; }
  .stack { order: -1; width: min(72%, 400px); margin: 0 auto 8px; }
  .note { grid-template-columns: 1fr; gap: 12px; }
  .bar nav { display: none; }
  .bar .tools { margin-left: auto; }
}
@media (max-width: 600px) {
  html { font-size: 16px; }
  .latest { display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 26px 0 40px; }
  .latest > div:first-child { display: contents; }
  .when { order: 1; margin-bottom: 12px; }
  .latest h1 { order: 2; font-size: clamp(36px, 10.5vw, 46px); margin-bottom: 20px; }
  .stack { order: 3; width: 100%; aspect-ratio: 8.5 / 6.2; margin: 0 0 22px; perspective: none; }
  .stack .s2, .stack .s3 { display: none; }
  .stack .sheet.s1, .stack:hover .sheet.s1 { transform: none; border-radius: 2px; }
  .latest .deck { order: 4; margin-bottom: 14px; }
  .folio { order: 5; margin-bottom: 22px; max-width: none; }
  .actions { order: 6; }
  .read { width: 100%; justify-content: center; }
  .r-top .wrap { gap: 10px; }
  .r-title { order: 0; flex-basis: calc(100% - 150px); }
  .r-jump { order: 3; width: 100%; justify-content: space-between; }
  .r-jump a { flex: 1; text-align: center; border-color: var(--rule); }
  .r-pages { padding: 14px 0 32px; gap: 26px; }
  .r-page { scroll-margin-top: 140px; }
  .bar .nameplate { font-size: 23px; }
  .entry { grid-template-columns: 54px minmax(0, 1fr) 76px; gap: 14px; padding: 18px 0; }
  .entry .d b { font-size: 30px; }
  .entry p { font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .keys { grid-template-columns: repeat(3, 84px); }
  .key { height: 66px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<section id="lock">
  <div class="form">
    <h1 class="nameplate">The Olivia Times</h1>
    <div class="dateline"><span>The archive</span><span>Every issue, kept</span></div>
    <p class="ask">Enter the passcode to read the back issues.</p>
    <form id="unlock" autocomplete="off">
      <div class="blanks" id="blanks" aria-hidden="true"></div>
      <input id="code" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Passcode">
      <div class="keys" id="keys"></div>
    </form>
    <label class="check"><input type="checkbox" id="remember" checked>Remember this device</label>
    <p class="status" id="status" role="status"></p>
  </div>
</section>

<div id="app" hidden>
  <div class="bar"><div class="wrap">
    <a class="nameplate" href="#/">The Olivia Times</a>
    <nav><a href="#calendar">Calendar</a><a href="#index">Every issue</a></nav>
    <div class="tools">
      <button class="square" id="theme" aria-label="Switch between night and day"></button>
      <button class="square" id="lockup" aria-label="Lock the archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </div></div>

  <main class="wrap">
    <article class="latest" id="latest"></article>
    <div class="note" id="note"></div>

    <section class="part" id="calendar">
      <header><h2>Calendar</h2><div class="years" id="years"></div></header>
      <div class="year"><div class="grid-scroll" id="scroller"><div class="heat" id="heat"></div></div>
        <div class="key-line"><span id="year-count"></span><span><i style="background:var(--raise2)"></i>No paper<i style="background:var(--red)"></i>Printed</span></div></div>
    </section>

    <section class="part" id="onthisday" hidden>
      <header><h2>On this day</h2><p>The same date, in years before.</p></header>
      <div id="otd"></div>
    </section>

    <section class="part" id="index">
      <header><h2>Every issue</h2><p id="index-count"></p></header>
      <label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Search headlines and stories" aria-label="Search every issue"><kbd>/</kbd></label>
      <div id="issues"></div>
    </section>

    <footer><span class="nameplate">The Olivia Times</span><p id="colophon"></p></footer>
  </main>
</div>

<div id="reader" hidden>
  <div class="r-top"><div class="wrap">
    <button class="square" id="r-close" aria-label="Back to the archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="r-title"><span id="r-meta"></span><b id="r-head"></b></div>
    <button class="square" id="r-older" aria-label="The day before"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 17 6 12l5-5M18 17l-5-5 5-5"/></svg></button>
    <button class="square" id="r-newer" aria-label="The day after"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"/></svg></button>
    <nav class="r-jump" id="jump" aria-label="Pages"></nav>
  </div></div>
  <div class="r-pages" id="rpages"></div>
</div>
<div class="tip" id="tip" hidden></div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} },
                drop(k) { try { localStorage.removeItem(k); } catch {} } };
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z"/></svg>';
let META, KEY, ISSUES = [];
const blobs = new Map();
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- crypto ----------
async function decrypt(bytes) { const u = new Uint8Array(bytes); return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12)); }
async function tryKey(key) { KEY = key; try { await decrypt(b64(META.check)); return true; } catch { KEY = null; return false; } }
function image(path) {
  if (!blobs.has(path)) blobs.set(path, fetch(path).then(r => { if (!r.ok) throw r.status; return r.arrayBuffer(); }).then(decrypt)
    .then(b => URL.createObjectURL(new Blob([b], { type: "image/webp" }))));
  return blobs.get(path);
}
function fill(el, path) {
  return image(path).then(src => { const img = new Image(); img.alt = ""; img.decoding = "async";
    img.onload = () => { img.classList.add("ready"); el.querySelector(".loading")?.remove(); }; img.src = src; el.append(img); return img; })
    .catch(() => el.querySelector(".loading")?.remove());
}

// ---------- words ----------
const local = d => { const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day); };
const fmt = (d, o) => local(d).toLocaleDateString("en-US", o);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const volNo = i => i.volume ? `Vol. ${i.volume}, No. ${i.number}` : "";
const cents = p => { const m = String(p || "").match(/([\d.,]+)\s*(¢)?/); if (!m) return 0; const v = parseFloat(m[1].replace(/,/g, "")); return m[2] ? v / 100 : v; };
const price = v => v < 1 ? `${Math.round(v * 100)}¢` : `$${v.toFixed(2)}`;
const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
const count = (n, one, many) => `${n <= 10 ? WORDS[n] : n.toLocaleString()} ${n === 1 ? one : many}`;

// ---------- theme ----------
function theme(t) { document.documentElement.dataset.theme = t; $("#theme").innerHTML = t === "night" ? SUN : MOON;
  $('meta[name="theme-color"]').content = t === "night" ? "#100f0d" : "#efe9de"; store.set("ot-theme", t); }
$("#theme").addEventListener("click", () => theme(document.documentElement.dataset.theme === "night" ? "day" : "night"));
theme(store.get("ot-theme") || "day");

// ---------- lock ----------
let typed = "";
const blanks = (state = "") => { $("#blanks").className = "blanks " + state;
  $("#blanks").innerHTML = Array.from({ length: META.length || 4 }, (_, i) => `<span class="blank ${i < typed.length ? "on" : ""}"></span>`).join(""); };
async function attempt() {
  $("#status").textContent = "Opening…";
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(typed), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(META.salt), iterations: META.iterations, hash: "SHA-256" },
                                            base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  if (!(await tryKey(key))) {
    $("#status").textContent = "That's not the passcode. Try again.";
    blanks("wrong"); setTimeout(() => { typed = ""; $("#code").value = ""; blanks(); }, 600); return;
  }
  if ($("#remember").checked) store.set("olivia-times-key", btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key)))));
  $("#status").textContent = ""; blanks("right");
  await openArchive();
  $("#lock").classList.add("leaving");
  setTimeout(() => $("#lock").hidden = true, still ? 0 : 700);
}
function press(k) {
  typed = k === "del" ? typed.slice(0, -1) : typed.length < (META.length || 64) ? typed + k : typed;
  $("#code").value = typed; blanks();
  if (META.length && typed.length === META.length) attempt();
}
function buildLock() {
  if (META.numeric === false) {
    $("#code").classList.add("shown"); $("#code").inputMode = "text"; $("#blanks").hidden = true; $("#keys").hidden = true;
    $("#unlock").addEventListener("submit", e => { e.preventDefault(); typed = $("#code").value; attempt(); }); $("#code").focus(); return;
  }
  blanks();
  $("#keys").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"].map(k => k === "" ? '<span class="gap"></span>'
    : `<button type="button" class="key ${k === "del" ? "word" : ""}" data-k="${k}" aria-label="${k === "del" ? "Delete" : k}">${k === "del" ? "Delete" : k}</button>`).join("");
  $("#keys").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) press(b.dataset.k); });
  addEventListener("keydown", e => {
    if ($("#lock").hidden || e.metaKey || e.ctrlKey) return;
    if (/^\d$/.test(e.key)) { press(e.key); const b = $(`[data-k="${e.key}"]`); b?.classList.add("hit"); setTimeout(() => b?.classList.remove("hit"), 120); }
    if (e.key === "Backspace") press("del");
  });
}
$("#lockup").addEventListener("click", () => { store.drop("olivia-times-key"); location.hash = ""; location.reload(); });

// ---------- the latest issue ----------
function latest() {
  const i = ISSUES[0], today = i.date === iso(new Date());
  $("#latest").innerHTML = `
    <div>
      <p class="when">${today ? "<b>This morning</b> · " : ""}${fmt(i.date, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</p>
      <h1>${esc(i.headline || "The Olivia Times")}</h1>
      <p class="deck">${esc(i.deck)}</p>
      <div class="folio">${[i.volume && [`Volume ${i.volume}`, `No. ${i.number}`], i.price && ["Cost to print", i.price],
        i.high && ["High", `${i.high}°`], i.gpa && ["GPA", i.gpa]].filter(Boolean).map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>
      <div class="actions"><a class="read" href="#/${i.date}">Read ${today ? "this morning's" : fmt(i.date, { weekday: "long" }) + "'s"} paper</a>
        ${ISSUES.length > 1 ? `<button class="textlink" id="random">Open a random day</button>` : ""}</div>
    </div>
    <div class="stack ${still ? "" : "arrive"}" id="stack" role="link" tabindex="0" aria-label="Open this issue">
      <div class="sheet s3" data-src="data/${i.date}/p${Math.min(3, i.pages || 1)}.bin"></div>
      <div class="sheet s2" data-src="data/${i.date}/p${Math.min(2, i.pages || 1)}.bin"></div>
      <div class="sheet s1" data-src="data/${i.date}/p1.bin"><span class="loading"></span></div>
    </div>`;
  $$("#stack .sheet").forEach(s => fill(s, s.dataset.src));
  const stack = $("#stack"), go = () => location.hash = `#/${i.date}`;
  stack.addEventListener("click", go);
  stack.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  if (!still && matchMedia("(hover: hover)").matches) {
    stack.addEventListener("pointermove", e => { const r = stack.getBoundingClientRect();
      stack.style.setProperty("--ry", `${((e.clientX - r.left) / r.width - .5) * 10}deg`); stack.style.setProperty("--rx", `${-((e.clientY - r.top) / r.height - .5) * 10}deg`); });
    stack.addEventListener("pointerleave", () => { stack.style.setProperty("--ry", "0deg"); stack.style.setProperty("--rx", "0deg"); });
  }
  $("#random")?.addEventListener("click", () => location.hash = `#/${ISSUES[Math.floor(Math.random() * ISSUES.length)].date}`);
}

function note() {
  const first = ISSUES[ISSUES.length - 1], last = ISSUES[0], spent = ISSUES.reduce((t, i) => t + cents(i.price), 0);
  const parts = [`${count(ISSUES.length, "issue", "issues")} so far. The paper has printed every morning since <b>${fmt(first.date, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</b>${spent ? `, for <b class="num">${price(spent)}</b> in paper and writing` : ""}.`];
  if (last.gpa) parts.push(`The latest report card averages <b class="num">${esc(last.gpa)}</b>${last.gpa_weighted ? ` (<b class="num">${esc(last.gpa_weighted)}</b> weighted)` : ""}.`);
  if (last.followers) parts.push(`<b class="num">${esc(last.followers)}</b> people follow along on TikTok and Instagram.`);
  $("#note").innerHTML = `<h2>From the editor</h2><p>${parts.join(" ")}</p>`;
}

// ---------- calendar ----------
function calendar() {
  const byDay = new Map(ISSUES.map(i => [i.date, i]));
  const years = [...new Set(ISSUES.map(i => +i.date.slice(0, 4)))].sort((a, b) => b - a);
  const todayIso = iso(new Date()), tip = $("#tip");
  const draw = y => {
    $$("#years button").forEach(b => b.classList.toggle("on", +b.dataset.y === y));
    const end = new Date(y, 11, 31), d = new Date(y, 0, 1), cells = [];
    d.setDate(d.getDate() - d.getDay());
    for (let col = 1; d <= end; col++) {
      let label = "";  // a month's name sits over the week that holds its 1st
      for (let k = 0; k < 7; k++) { const x = new Date(d); x.setDate(x.getDate() + k);
        if (x.getDate() === 1 && x.getFullYear() === y) label = x.toLocaleDateString("en-US", { month: "short" }); }
      cells.push(`<div class="m" style="grid-column:${col};grid-row:1">${label}</div>`);
      for (let k = 0; k < 7; k++, d.setDate(d.getDate() + 1)) {
        const key = iso(d), i = byDay.get(key), out = d.getFullYear() !== y;
        cells.push(i && !out ? `<a class="d has ${key === todayIso ? "today" : ""}" href="#/${key}" style="grid-column:${col};grid-row:${k + 2}" data-day="${key}" aria-label="${esc(fmt(key, { weekday: "long", month: "long", day: "numeric" }))}: ${esc(i.headline)}"></a>`
          : `<div class="d ${out ? "out" : ""} ${key === todayIso ? "today" : ""}" style="grid-column:${col};grid-row:${k + 2}" data-day="${key}"></div>`);
      }
    }
    $("#heat").innerHTML = cells.join("");
    const n = ISSUES.filter(i => i.date.startsWith(String(y))).length;
    $("#year-count").textContent = `${count(n, "paper", "papers")} printed in ${y}`;
    // on a narrow screen, start the grid at this month rather than January
    const now = $("#heat .today") || $("#heat .has");
    if (now) $("#scroller").scrollLeft = Math.max(0, now.offsetLeft - $("#scroller").clientWidth + 80);
  };
  $("#years").innerHTML = years.map(y => `<button data-y="${y}">${y}</button>`).join("");
  $("#years").addEventListener("click", e => { const b = e.target.closest("button"); if (b) draw(+b.dataset.y); });
  $("#heat").addEventListener("pointerover", e => { const c = e.target.closest(".d:not(.out)"); if (!c) return;
    const i = byDay.get(c.dataset.day), r = c.getBoundingClientRect();
    tip.innerHTML = `<b>${fmt(c.dataset.day, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</b>${i ? esc(i.headline) : "No paper"}`;
    tip.style.left = `${Math.min(innerWidth - 150, Math.max(150, r.left + r.width / 2))}px`; tip.style.top = `${r.top}px`; tip.hidden = false; });
  $("#heat").addEventListener("pointerout", () => tip.hidden = true);
  addEventListener("scroll", () => tip.hidden = true, { passive: true });
  draw(years[0]);
}

// ---------- index ----------
function entry(i) {
  const facts = [volNo(i), i.price && `cost ${i.price}`, i.gpa && `GPA ${i.gpa}`, i.high && `high ${i.high}°`].filter(Boolean).join(" · ");
  return `<a class="entry" href="#/${i.date}">
    <div class="d"><b>${local(i.date).getDate()}</b><span>${fmt(i.date, { weekday: "short" })}</span></div>
    <div><h4>${esc(i.headline || "The Olivia Times")}</h4><p>${esc(i.deck)}</p><div class="facts num">${esc(facts)}</div></div>
    <div class="thumb" data-src="data/${i.date}/thumb.bin"><span class="loading"></span></div></a>`;
}
const later = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { later.unobserve(e.target); fill(e.target, e.target.dataset.src); } }), { rootMargin: "600px" });
function index() {
  const q = $("#q").value.trim().toLowerCase();
  const shown = ISSUES.filter(i => !q || `${i.headline} ${i.deck} ${i.lead} ${fmt(i.date, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}`.toLowerCase().includes(q));
  const by = new Map();
  shown.forEach(i => { const k = i.date.slice(0, 7); by.set(k, [...(by.get(k) || []), i]); });
  $("#issues").innerHTML = shown.length ? [...by].map(([k, list]) => `<div class="month"><h3>${fmt(k + "-01", { month: "long", year: "numeric" })}<span>${count(list.length, "issue", "issues")}</span></h3>${list.map(entry).join("")}</div>`).join("")
    : `<p class="none">${ISSUES.length ? `Nothing in the archive mentions “${esc(q)}.”` : "The first issue arrives tomorrow morning."}</p>`;
  $$("#issues .thumb").forEach(t => later.observe(t));
}
$("#q").addEventListener("input", index);
addEventListener("keydown", e => { if (e.key === "/" && KEY && $("#reader").hidden && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); $("#q").scrollIntoView({ block: "center" }); } });

async function openArchive() {
  ISSUES = JSON.parse(new TextDecoder().decode(await decrypt(await (await fetch("data/index.bin", { cache: "no-store" })).arrayBuffer())));
  $("#app").hidden = false;
  if (!ISSUES.length) { $("#latest").innerHTML = `<div><h1>The first issue arrives tomorrow morning.</h1></div>`; return; }
  latest(); note(); calendar(); index();
  $("#index-count").textContent = `${count(ISSUES.length, "morning", "mornings")}, newest first.`;
  $("#colophon").textContent = `Printed every morning since ${fmt(ISSUES[ISSUES.length - 1].date, { month: "long", day: "numeric", year: "numeric" })}.`;
  const md = iso(new Date()).slice(4), past = ISSUES.filter(i => i.date.slice(4) === md && +i.date.slice(0, 4) < new Date().getFullYear());
  if (past.length) { $("#onthisday").hidden = false; $("#otd").innerHTML = past.map(entry).join(""); $$("#otd .thumb").forEach(t => later.observe(t)); }
  route();
}

// ---------- reader ----------
const PAGE_NAMES = ["Front page", "The Briefing", "Puzzles & Funnies", "The Ledger"];
let current = null, spy = null;
function route() {
  const m = location.hash.match(/^#\/(\d{4}-\d{2}-\d{2})(?:\/(\d))?/), issue = m && ISSUES.find(i => i.date === m[1]);
  if (!issue) { $("#reader").hidden = true; document.body.style.overflow = ""; current = null; return; }
  const k = ISSUES.indexOf(issue), total = issue.pages || 4, older = ISSUES[k + 1], newer = ISSUES[k - 1];
  const fresh = current !== issue;
  current = issue; $("#reader").hidden = false; document.body.style.overflow = "hidden";
  if (fresh) {
    $("#r-meta").textContent = [fmt(issue.date, { weekday: "short", month: "short", day: "numeric", year: "numeric" }), volNo(issue)].filter(Boolean).join(" · ");
    $("#r-head").textContent = issue.headline || "The Olivia Times";
    $("#r-older").disabled = !older; $("#r-newer").disabled = !newer;
    $("#jump").innerHTML = Array.from({ length: total }, (_, n) => `<a href="#/${issue.date}/${n + 1}" data-p="${n + 1}">A${n + 1}</a>`).join("");
    $("#rpages").innerHTML = Array.from({ length: total }, (_, n) => `<section class="r-page" id="pg${n + 1}">
        <div class="label"><span><b>A${n + 1}</b> · ${PAGE_NAMES[n] || "Page " + (n + 1)}</span><a class="full" target="_blank" rel="noopener" hidden>Full size</a></div>
        <div class="sheet-big" data-src="data/${issue.date}/p${n + 1}.bin"><span class="loading"></span></div></section>`).join("")
      + `<div class="r-end">${older ? `<a href="#/${older.date}">← ${esc(fmt(older.date, { weekday: "long", month: "short", day: "numeric" }))}</a>` : "<span></span>"}
         ${newer ? `<a href="#/${newer.date}">${esc(fmt(newer.date, { weekday: "long", month: "short", day: "numeric" }))} →</a>` : ""}</div>`;
    $$("#rpages .sheet-big").forEach(el => fill(el, el.dataset.src).then(img => { const a = el.parentElement.querySelector(".full"); if (img && a) { a.href = img.src; a.hidden = false; } }));
    $("#reader").scrollTop = 0;
    spy?.disconnect();
    spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$("#jump a").forEach(a => a.classList.toggle("on", a.dataset.p === e.target.id.slice(2))); }),
                                   { root: $("#reader"), rootMargin: "-45% 0px -45% 0px" });
    $$("#rpages .r-page").forEach(p => spy.observe(p));
    $$("#jump a")[0]?.classList.add("on");
  }
  if (m[2]) $(`#pg${m[2]}`)?.scrollIntoView({ behavior: fresh ? "auto" : "smooth" });
}
$("#r-close").addEventListener("click", () => location.hash = "#index");
const step = d => { const k = ISSUES.indexOf(current) + d; if (ISSUES[k]) location.hash = `#/${ISSUES[k].date}`; };
$("#r-older").addEventListener("click", () => step(1));
$("#r-newer").addEventListener("click", () => step(-1));
addEventListener("keydown", e => {
  if ($("#reader").hidden) return;
  if (e.key === "Escape") location.hash = "#index";
  if (e.key === "ArrowRight") step(-1);
  if (e.key === "ArrowLeft") step(1);
});
addEventListener("hashchange", () => { if (KEY) route(); });

// ---------- start ----------
(async () => {
  if (!window.crypto?.subtle) { $("#status").textContent = "This browser can't open the archive. It needs a secure (https) page."; return; }
  META = await (await fetch("meta.json", { cache: "no-store" })).json();
  const saved = store.get("olivia-times-key");
  if (saved) {
    try { const key = await crypto.subtle.importKey("raw", b64(saved), { name: "AES-GCM" }, true, ["decrypt"]);
          if (await tryKey(key)) { $("#lock").hidden = true; return openArchive(); } } catch {}
    store.drop("olivia-times-key");
  }
  buildLock();
})();
</script>
</body>
</html>
