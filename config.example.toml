# Copy this to config.toml and edit it. Keys and passwords go in .env, not here.

[paper]
name = "The Olivia Times"
reader = "Olivia"
tagline = "All the News That's Fit for Olivia"
city = "Mission Hills, Kansas"
school = "Pembroke Hill School"
latitude = 39.0186
longitude = -94.6172
timezone = "America/Chicago"
first_issue = "2026-10-12"   # Vol. 1, No. 1
# Who the paper is for, so the front page's Feature picks stories that land.
interests = "a high school student who likes tech"

[schedule]
# When it prints (shown on the front page too). scripts/install.sh schedules the
# build 15 minutes earlier; rerun it after changing these.
weekday = "06:50"
weekend = "07:30"

[grades]
threshold = 92.5             # anything under this gets flagged
recent_days = 7              # "Tests & Big Grades" covers grades marked in this many days
zero_days = 30               # zeros drop off after this many days (Missing/Incomplete never do)
# Grading categories that count as tests and other big grades (a regular expression).
major = "exam|test|midterm|final|assessment|essay|project|portfolio"

[gpa]
# The page-4 estimate from current grades on a 4.0 scale. Weighted GPA adds this many
# percentage points to classes whose names match `weighted`, then converts again.
weighted_bonus = 5
weighted = "\\bAccelerated\\b|\\bAP\\b|\\bHonors\\b"

[schoology]
domain = "pembroke.schoology.com"

[email]
# Personal Gmail is read over IMAP with an app password (GMAIL_ADDRESS and
# GMAIL_APP_PASSWORD in .env). School mail arrives as a digest email sent by
# apps_script/school_digest.gs, with this subject:
digest_subject = "Olivia Times school digest"
lookback_hours = 24

[lunch]
# Today's menu from the school dining page; campus is "ward-parkway" or "wornall".
url = "https://www.pembrokehill.org/school-life/lunch-program/lunch-menu"
campus = "ward-parkway"

[sports]
# Last night's score, only on mornings after a game. ESPN team code; "" turns it off.
nfl_team = "kc"

[news]
tech_feeds = [
  "https://www.theverge.com/rss/index.xml",
  "https://techcrunch.com/feed/",
]
local_feeds = [
  "https://www.kcur.org/news.rss",
  "https://www.kshb.com/news/local-news.rss",
]
world_feeds = [
  "https://feeds.bbci.co.uk/news/world/rss.xml",
]
interest_feeds = [            # the front page's Feature, on days without school lunch
  "https://www.gamedeveloper.com/rss.xml",
  "https://www.rockpapershotgun.com/feed",
  "https://www.tubefilter.com/feed/",
  "https://www.theverge.com/rss/creators/index.xml",
  "https://www.quantamagazine.org/feed/",
  "https://www.livescience.com/feeds/all",
  "https://www.sciencenews.org/feed",
]
hacker_news = true
max_age_days = 7              # no story older than this; the newest are picked first

[comic]
# A black-and-white daily strip starring your avatar, drawn by Google's Gemini
# image model (GEMINI_API_KEY in .env). Set up the avatar once with
# `python -m paper avatar make <photos>`, then `python -m paper avatar pick A`.
enabled = true
model = ""                   # blank = newest Gemini image model your key can use
size = "2K"                  # sharper line art; "1K" is a few cents cheaper
look = "a teenage girl with long, straight, light-blonde hair"
# A different show's art style each day, in this order.
styles = [
  "The Simpsons", "Bob's Burgers", "Futurama", "King of the Hill", "Daria",
  "BoJack Horseman", "Rick and Morty", "Archer", "Family Guy", "American Dad!",
  "South Park", "Solar Opposites",
]

[printer]
name = ""                    # printer name; blank uses the default printer

[price]
# The front page's price is what the issue cost to make: paper plus the API calls.
paper_per_100_sheets = 2.40

[social]
# Public numbers only (no logins). TikTok's pay is estimated from views gained since the
# last paper: views x tiktok_qualified x tiktok_rpm dollars per 1,000 qualified views.
tiktok = "zenithwhatif"
instagram = "zenith.whatif"
tiktok_qualified = 0.35
tiktok_rpm = 0.26

[spend]
# Neither API key can report its own balance, so copy each one in with the date you
# read it (console.anthropic.com → Billing; aistudio.google.com → Billing). Page 4
# subtracts what the paper has spent since then. 0 = show spending only.
anthropic_credit = 0.00
anthropic_since = "2026-10-12"
gemini_credit = 0.00
gemini_since = "2026-10-12"

[claude]
# Claude Code logins on this PC: their weekly limits and overnight sessions go on page 4.
# Blank config_dir is the usual login. Sign the second account in once with:
#   CLAUDE_CONFIG_DIR=~/.claude-2 claude      (then type /login)
accounts = [
  { name = "Claude", config_dir = "" },
  { name = "Claude (2nd)", config_dir = "~/.claude-2" },
]

[overnight]
since = "21:00"              # "While You Slept" covers Claude sessions from this time last night

# Countdowns on the front page: the next three still to come. Add school breaks,
# birthdays, trips, the last day of school...
[[countdown]]
name = "Halloween"
date = "2026-10-31"

[[countdown]]
name = "Thanksgiving"
date = "2026-11-26"

[[countdown]]
name = "Christmas"
date = "2026-12-25"

[[countdown]]
name = "New Year's Day"
date = "2027-01-01"

[archive]
# Every issue on a passcode-locked website (python -m paper archive publish). The pages are
# encrypted with this passcode; a longer one is much harder to guess than 4 digits.
passcode = ""
repo = ""                    # GitHub repo for the site, like "viaate/olivia-times-archive"
publish = false              # true = push the site after every morning's build
