# Copy this to config.toml and edit it. Keys and passwords go in .env, not here.

[paper]
name = "The Olivia Times"
reader = "Olivia"
tagline = "All the News That's Fit for Olivia"
city = "Mission Hills, Kansas"
school = "Pembroke Hill School"
latitude = 39.0186
longitude = -94.6172
timezone = "America/Chicago"
first_issue = "2026-10-12"   # Vol. 1, No. 1

[schedule]
# When it prints (shown on the front page too). scripts/install.sh schedules the
# build 15 minutes earlier; rerun it after changing these.
weekday = "06:50"
weekend = "07:30"

[grades]
threshold = 92.5             # anything under this gets flagged

[schoology]
domain = "pembroke.schoology.com"

[email]
# Personal Gmail is read over IMAP with an app password (GMAIL_ADDRESS and
# GMAIL_APP_PASSWORD in .env). School mail arrives as a digest email sent by
# apps_script/school_digest.gs, with this subject:
digest_subject = "Olivia Times school digest"
lookback_hours = 24

[news]
tech_feeds = [
  "https://www.theverge.com/rss/index.xml",
  "https://techcrunch.com/feed/",
]
local_feeds = [
  "https://www.kcur.org/news.rss",
  "https://www.kshb.com/news/local-news.rss",
]
world_feeds = [
  "https://feeds.bbci.co.uk/news/world/rss.xml",
]
hacker_news = true

[comic]
# A black-and-white daily strip starring your avatar, drawn by Google's Gemini
# image model (GEMINI_API_KEY in .env). Set up the avatar once with
# `python -m paper avatar make <photos>`, then `python -m paper avatar pick A`.
enabled = true
model = ""                   # blank = newest Gemini image model your key can use
size = "2K"                  # sharper line art; "1K" is a few cents cheaper
look = "a teenage girl with long, straight, light-blonde hair"
# A different show's art style each day, in this order.
styles = [
  "The Simpsons", "Bob's Burgers", "Futurama", "King of the Hill", "Daria",
  "BoJack Horseman", "Rick and Morty", "Archer", "Family Guy", "American Dad!",
  "South Park", "Solar Opposites",
]

[printer]
name = ""                    # printer name; blank uses the default printer

# Countdowns on the front page: the next three still to come. Add school breaks,
# birthdays, trips, the last day of school...
[[countdown]]
name = "Halloween"
date = "2026-10-31"

[[countdown]]
name = "Thanksgiving"
date = "2026-11-26"

[[countdown]]
name = "Christmas"
date = "2026-12-25"

[[countdown]]
name = "New Year's Day"
date = "2027-01-01"
